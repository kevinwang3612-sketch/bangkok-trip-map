<style>
/* Layout: one-screen travel app. Phone = map on top, day timeline below; desktop = timeline rail left, map right. */
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1e2a33; --muted:#5f6b73; --line:#e3ded3;
  --sea:#cfe3ea; --land:#f3efe4; --coast:#9fbcc6;
  --group:#2f5da8; --group-soft:#e3ebf8;
  --free:#d8761e; --free-soft:#fcecdc;
  --move:#6b7780; --move-soft:#eceff1;
  --tbc:#b4372f; --tbc-soft:#fbe5e2;
  --font-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-num:"Outfit","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1f; --panel:#1b232a; --ink:#e8ecef; --muted:#9aa6ae; --line:#2c363e;
  --sea:#13232c; --land:#222c33; --coast:#3d5966;
  --group:#7fa6ea; --group-soft:#1f2c42;
  --free:#f0a057; --free-soft:#3a2a1a;
  --move:#9aa6ae; --move-soft:#262f36;
  --tbc:#f08a80; --tbc-soft:#3b2120; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1f; --panel:#1b232a; --ink:#e8ecef; --muted:#9aa6ae; --line:#2c363e;
  --sea:#13232c; --land:#222c33; --coast:#3d5966;
  --group:#7fa6ea; --group-soft:#1f2c42;
  --free:#f0a057; --free-soft:#3a2a1a;
  --move:#9aa6ae; --move-soft:#262f36;
  --tbc:#f08a80; --tbc-soft:#3b2120; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:8px;flex:none}
.title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{font-size:12.5px;color:var(--muted)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px;padding-block:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;
  padding:5px 12px;font:inherit;font-size:13.5px;cursor:pointer;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.day b{font-family:var(--font-num);font-weight:700}
.day span{color:var(--muted);font-size:12px}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] span{color:var(--bg);opacity:.8}
.day:focus-visible,.layer:focus-visible,.item:focus-visible,.btn:focus-visible{outline:2px solid var(--group);outline-offset:2px}
.layers{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.layer{font:inherit;font-size:12.5px;border-radius:8px;padding:3px 10px 3px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.layer i{width:10px;height:10px;border-radius:50%;display:inline-block}
.layer[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.layer.g i{background:var(--group)} .layer.f i{background:var(--free)} .layer.m i{background:transparent;border:2px dashed var(--move);border-radius:2px;width:12px;height:0}

.main{flex:1;min-height:0;display:flex;flex-direction:column}
.mapwrap{position:relative;flex:0 0 46%;min-height:0;border-bottom:1px solid var(--line)}
#map{position:absolute;inset:0;background:var(--sea)}
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-block:12px calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:860px){
  .main{flex-direction:row-reverse}
  .mapwrap{flex:1;border-bottom:0;border-left:1px solid var(--line)}
  .list{flex:0 0 400px}
}
.basemap-note{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:10px;z-index:500;max-width:min(320px,70%);
  background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:8px;font-size:11.5px;padding:4px 8px;line-height:1.4}

.dayhead{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}

const modeLabel={car:"包車",flight:"飛機",bus:"遊覽車",walk:"走路",boat:"接駁船",train:"BTS"};
const typeLabel={group:"團體",free:"自由建議",move:"交通"};

/* ---------- map ---------- */
const map=L.map("map",{zoomControl:true,attributionControl:true,minZoom:4,maxZoom:18,zoomSnap:.5});
map.attributionControl.setPrefix(false);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const toLL=r=>r.map(([x,y])=>[y,x]);
const landStyle=()=>({stroke:false,fillColor:css("--land"),fillOpacity:1,interactive:false});
const coastStyle=()=>({color:css("--coast"),weight:1,fill:false,interactive:false});
function mkLand(polys){const g=L.layerGroup();polys.forEach(p=>{const rings=p.map(toLL);
  L.polygon(rings,landStyle()).addTo(g);});return g;}
const wide=mkLand(LAND.wide), th=mkLand(LAND.th), tw=mkLand(LAND.tw);
let vectorOn=true;
function syncLand(){ if(!vectorOn)return; const z=map.getZoom();
  if(z>=8){map.removeLayer(wide)}else if(!map.hasLayer(wide)){wide.addTo(map);wide.eachLayer(l=>l.bringToBack())}}
function addVector(){wide.addTo(map);th.addTo(map);tw.addTo(map);
  map.attributionControl.addAttribution("海岸線 © Natural Earth");
  const n=document.getElementById("bnote");n.hidden=false;
  n.textContent="簡化底圖（沒有街道）。點標記可開 Google Maps 看實際位置與導航 📍";}
/* 先試 OpenStreetMap 街道圖磚；載不到就用內建的簡化海岸線 */
function tileUrl(){return "https://tile.openstreetmap.org/{z}/{x}/{y}.png";}
addVector();
(function tryTiles(){const img=new Image();let done=false;
  img.onload=()=>{if(done)return;done=true;vectorOn=false;[wide,th,tw].forEach(l=>map.removeLayer(l));
    document.getElementById("bnote").hidden=true;
    L.tileLayer(tileUrl(),{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);};
  img.onerror=()=>{done=true};
  setTimeout(()=>{done=true},4000);
  img.src="https://tile.openstreetmap.org/5/25/14.png";})();
map.on("zoomend",syncLand);

const routeLayer=L.layerGroup().addTo(map);
const markerLayer=L.layerGroup().addTo(map);
const markers={};

/* ---------- state ---------- */
let state={day:"all",show:{group:true,free:true,move:true},active:null};
try{const s=JSON.parse(localStorage.getItem("bkkmap")||"null");if(s){state.day=s.day||"all";Object.assign(state.show,s.show||{});}}catch(e){}
function save(){try{localStorage.setItem("bkkmap",JSON.stringify({day:state.day,show:state.show}))}catch(e){}}

function visibleDays(){return state.day==="all"?DAYS:DAYS.filter(d=>d.id===state.day)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function gmaps(p){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.prec==="ok"?p.ll.join(","):p.q)}

function popupHtml(id,entries){const p=P[id];
  const sched=entries.map(e=>`<li style="--c:var(--${e.t})"><span class="t">${esc(e.date)} ${esc(e.time||"")}</span><span>${esc(e.w)}${e.tbc?' <span class="tag tbc">待領隊確認</span>':''}</span></li>`).join("");
  return `<div class="pop"><h3>${p.k} ${esc(p.n)}</h3><div class="en">${esc(p.en)}</div>
    ${sched?`<ul class="sched">${sched}</ul>`:""}
    <div>${esc(p.info)}</div>
    <div class="prec ${p.prec}">${p.prec==="ok"?"📍 座標已查證（來源："+esc(p.src)+"）":"📍 大約位置，實際以 Google Maps 為準"}</div>
    <a class="btn" href="${gmaps(p)}" target="_blank" rel="noopener">在 Google Maps 開啟</a></div>`;}

function render(){
  save();
  document.querySelectorAll(".day").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===state.day));
  ["group","free","move"].forEach(t=>document.getElementById({group:"lg",free:"lf",move:"lm"}[t]).setAttribute("aria-pressed",state.show[t]));
  routeLayer.clearLayers();markerLayer.clearLayers();for(const k in markers)delete markers[k];
  const days=visibleDays();
  /* routes */
  days.forEach(d=>d.routes.forEach(([a,b,t,mode])=>{ if(!state.show[t])return;
    const col=css("--"+t);
    const dash=mode==="flight"?"2 8":(t==="free"?"6 6":(t==="move"?"8 6":null));
    const line=L.polyline([P[a].ll,P[b].ll],{color:col,weight:mode==="flight"?2:3.5,opacity:.85,dashArray:dash,lineCap:"round"});
    line.bindTooltip(`${modeLabel[mode]}・${typeLabel[t]}（示意直線）`,{sticky:true,className:"lbl"});
    line.addTo(routeLayer);}));
  /* markers: collect entries per place */
  const per={};
  days.forEach(d=>d.items.forEach(it=>{if(!it.p||!state.show[it.t])return;(per[it.p]=per[it.p]||[]).push({...it,date:d.date});}));
  const pts=[];
  Object.entries(per).forEach(([id,entries])=>{const p=P[id];
    const t=(entries.some(e=>e.t==="group")||(p.hotel&&state.show.group))?"group":(entries.some(e=>e.t==="free")?"free":"move");
    const icon=L.divIcon({className:"pin-wrap "+t,html:`<div class="pin ${p.hotel?"hotel":""} ${t==="free"?"free":""}">${p.k}</div>`,iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-14]});
    const m=L.marker(p.ll,{icon,title:p.n,riseOnHover:true}).bindPopup(popupHtml(id,entries),{maxWidth:300,autoPanPadding:[20,20]});
    m.bindTooltip(p.n,{permanent:!p.minor,direction:"right",offset:[16,0],className:"lbl"});
    m.addTo(markerLayer);markers[id]=m;pts.push(p.ll);});
  renderList(days);
  if(pts.length){const b=L.latLngBounds(pts);map.fitBounds(b,{padding:[40,40],maxZoom:15,animate:false});}
  else map.setView([13.4,100.7],8);
  syncLand();
}

function renderList(days){const el=document.getElementById("list");let h="";
  days.forEach(d=>{const its=d.items.filter(it=>state.show[it.t]);
    h+=`<section class="daygroup"><div class="dayhead"><h2>${d.date}（${d.wd}）${esc(d.title)}</h2><p>${esc(d.sum)}</p></div><ul class="timeline">`;
    if(!its.length)h+=`<li class="empty">這天在目前的圖層下沒有項目，打開上面的圖層看看～</li>`;
    its.forEach(it=>{const idx=d.items.indexOf(it);
      h+=`<li><button class="item ${it.t}" data-d="${d.id}" data-i="${idx}" ${it.p?"":"data-nopin"}>
        <span class="time">${esc(it.time||"·")}</span>
        <span class="body"><span class="what">${esc(it.w)}</span>
        ${it.note?`<span class="note">${esc(it.note)}${it.tbc?"：":""}${it.tbc?"<b>待領隊確認</b>":""}</span>`:(it.tbc?`<span class="note"><b>待領隊確認</b></span>`:"")}
        <span class="tags"><span class="tag ${it.t}">${typeLabel[it.t]}</span>${it.tbc?'<span class="tag tbc">待確認</span>':""}${it.p?"":'<span class="tag nopin">地圖未標</span>'}${it.p&&P[it.p].prec==="approx"?'<span class="tag nopin">大約位置</span>':""}</span></span>
      </button></li>`;});
    h+=`</ul></section>`;});
  h+=`<div class="foot">
    <div>🔵 實線＝團體行程　🟠 虛線＝自由時間建議　灰色＝自己的交通（包車、飛機）。地圖上的連線是示意直線，不是實際路線。</div>
    <div>「待領隊確認」的時間請以領隊高毅公布為準。營業時間是 2026/11/18 查到的資料，出發前再用 Google Maps 確認一次。</div>
    <div>自由時間建議的完整說明：<a href="https://claude.ai/artifact/KkwhwJSFhoUARJ4AUjgGg9" target="_blank" rel="noopener">曼谷芭達雅自由時間行程建議</a></div>
  </div>`;
  el.innerHTML=h;}

document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest(".item");if(!b)return;
  const d=DAYS.find(x=>x.id===b.dataset.d),it=d.items[+b.dataset.i];
  document.querySelectorAll(".item.active").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  if(!it.p)return;const m=markers[it.p];if(!m)return;
  map.flyTo(P[it.p].ll,Math.max(map.getZoom(),14),{duration:.6});
  map.once("moveend",()=>m.openPopup());});

/* day tabs */
const daysEl=document.getElementById("days");
[{id:"all",date:"全部",wd:"5 天"},...DAYS].forEach(d=>{const b=document.createElement("button");b.className="day";b.dataset.id=d.id;
  b.innerHTML=`<b>${d.date}</b><span>${d.id==="all"?d.wd:"週"+d.wd}</span>`;
  b.onclick=()=>{state.day=d.id;render();b.scrollIntoView({inline:"nearest",block:"nearest"});};daysEl.appendChild(b);});
[["lg","group"],["lf","free"],["lm","move"]].forEach(([id,t])=>document.getElementById(id).onclick=()=>{state.show[t]=!state.show[t];render();});

render();
setTimeout(()=>map.invalidateSize(),200);
addEventListener("resize",()=>map.invalidateSize());
</script>
